apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shortliner
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.service }}-svc
                port:
                  number: {{ .Values.ingress.port }}
