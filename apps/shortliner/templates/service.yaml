{{- range .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}-svc
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ .name }}
spec:
  selector:
    app: {{ .name }}
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: {{ .servicePort | default .port }}
      targetPort: http
    {{- if .managementPort }}
    - name: management
      protocol: TCP
      port: {{ .managementPort }}
      targetPort: management
    {{- end }}
{{- end }}
