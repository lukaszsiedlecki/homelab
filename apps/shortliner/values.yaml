namespace: shortliner
imageRegistry: ghcr.io/lukaszsiedlecki
ingress:
  host: shortliner.local
  # All traffic enters through the BFF gateway; it routes /api/<service>/** to the
  # backends (with the user's token) and everything else to shortliner-frontend.
  service: shortliner-gateway
  port: 8084
services:
  - name: shortliner
    image: shortliner
    tag: sha-b74b398
    port: 8080
    # Actuator (probes + metrics) on a separate port — see MANAGEMENT_SERVER_PORT
    # in templates/deployment.yaml.
    managementPort: 9090
    metrics:
      enabled: true
    replicas: 1
    strategy: Recreate
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    probes:
      readinessPath: /actuator/health/readiness
      readinessDelay: 30
      livenessPath: /actuator/health/liveness
      livenessDelay: 60
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0"
      # ECS JSON logs on stdout (Spring Boot >= 3.4) — parsed by Alloy/Loki.
      - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
        value: "ecs"
      - name: SPRING_MAIN_BANNER_MODE
        value: "off"
      # Keycloak resource server: JWKS from the in-cluster Service (keycloak.local doesn't
      # resolve from pods), but tokens carry iss=http://keycloak.local/... so check that.
      - name: KEYCLOAK_JWK_SET_URI
        value: "http://keycloak.keycloak.svc.cluster.local/realms/shortliner/protocol/openid-connect/certs"
      - name: KEYCLOAK_ISSUER_URI
        value: "http://keycloak.local/realms/shortliner"
      - name: DB_HOST
        value: "192.168.0.78"
      - name: DB_NAME
        value: "shortliner"
      - name: DB_USERNAME
        secretRef:
          name: shortliner-db-secret
          key: DB_USER
      - name: DB_PASSWORD
        secretRef:
          name: shortliner-db-secret
          key: DB_PASSWORD
      - name: KAFKA_BOOTSTRAP_SERVERS
        value: "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
      - name: CORS_ALLOWED_ORIGINS
        value: "http://shortliner.local"
  - name: shortliner-analytics
    image: shortliner-analytics
    tag: sha-439e4c3
    port: 8082
    # Actuator (probes + metrics) on a separate port — see MANAGEMENT_SERVER_PORT
    # in templates/deployment.yaml.
    managementPort: 9090
    metrics:
      enabled: true
    replicas: 1
    strategy: Recreate
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    probes:
      readinessPath: /actuator/health/readiness
      readinessDelay: 30
      livenessPath: /actuator/health/liveness
      livenessDelay: 60
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0"
      # ECS JSON logs on stdout (Spring Boot >= 3.4) — parsed by Alloy/Loki.
      - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
        value: "ecs"
      - name: SPRING_MAIN_BANNER_MODE
        value: "off"
      # Keycloak resource server: JWKS from the in-cluster Service (keycloak.local doesn't
      # resolve from pods), but tokens carry iss=http://keycloak.local/... so check that.
      - name: KEYCLOAK_JWK_SET_URI
        value: "http://keycloak.keycloak.svc.cluster.local/realms/shortliner/protocol/openid-connect/certs"
      - name: KEYCLOAK_ISSUER_URI
        value: "http://keycloak.local/realms/shortliner"
      - name: DB_HOST
        value: "192.168.0.78"
      - name: DB_NAME
        value: "shortliner_analytics"
      - name: DB_USERNAME
        secretRef:
          name: shortliner-analytics-db-secret
          key: DB_USER
      - name: DB_PASSWORD
        secretRef:
          name: shortliner-analytics-db-secret
          key: DB_PASSWORD
      - name: KAFKA_BOOTSTRAP_SERVERS
        value: "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
  - name: shortliner-payment
    image: shortliner-payment
    tag: sha-bfedd12
    port: 8083
    # Actuator (probes + metrics) on a separate port — see MANAGEMENT_SERVER_PORT
    # in templates/deployment.yaml.
    managementPort: 9090
    metrics:
      enabled: true
    replicas: 2
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    probes:
      readinessPath: /actuator/health/readiness
      readinessDelay: 30
      livenessPath: /actuator/health/liveness
      livenessDelay: 60
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0"
      # ECS JSON logs on stdout (Spring Boot >= 3.4) — parsed by Alloy/Loki.
      - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
        value: "ecs"
      - name: SPRING_MAIN_BANNER_MODE
        value: "off"
      # Keycloak resource server: JWKS from the in-cluster Service (keycloak.local doesn't
      # resolve from pods), but tokens carry iss=http://keycloak.local/... so check that.
      - name: KEYCLOAK_JWK_SET_URI
        value: "http://keycloak.keycloak.svc.cluster.local/realms/shortliner/protocol/openid-connect/certs"
      - name: KEYCLOAK_ISSUER_URI
        value: "http://keycloak.local/realms/shortliner"
      - name: DB_HOST
        value: "192.168.0.78"
      - name: DB_NAME
        value: "shortliner_payment"
      - name: DB_USERNAME
        secretRef:
          name: shortliner-payment-db-secret
          key: DB_USER
      - name: DB_PASSWORD
        secretRef:
          name: shortliner-payment-db-secret
          key: DB_PASSWORD
      - name: KAFKA_BOOTSTRAP_SERVERS
        value: "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
      - name: PAYMENT_DEBUG_ENABLED
        value: "false"
  # Backend-for-Frontend: OIDC login against Keycloak, session cookie to the browser,
  # access token relayed to the backends. The Ingress points here (see ingress.service).
  - name: shortliner-gateway
    image: shortliner-gateway
    tag: sha-949bd81
    port: 8084
    managementPort: 9090
    metrics:
      enabled: true
    # Sessions (and the tokens behind them) are in memory — >1 replica needs Spring Session first.
    replicas: 1
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 768Mi
    probes:
      readinessPath: /actuator/health/readiness
      readinessDelay: 20
      livenessPath: /actuator/health/liveness
      livenessDelay: 60
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0"
      - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
        value: "ecs"
      - name: SPRING_MAIN_BANNER_MODE
        value: "off"
      # Browser-facing issuer (login/logout redirects, `iss` claim) vs. in-cluster URL for
      # token/JWKS/userinfo calls — keycloak.local doesn't resolve from pods.
      - name: KEYCLOAK_ISSUER_URI
        value: "http://keycloak.local/realms/shortliner"
      - name: KEYCLOAK_INTERNAL_URI
        value: "http://keycloak.keycloak.svc.cluster.local/realms/shortliner"
      - name: KEYCLOAK_CLIENT_ID
        value: "shortliner-gateway"
      - name: KEYCLOAK_CLIENT_SECRET
        secretRef:
          name: shortliner-gateway-keycloak
          key: KEYCLOAK_CLIENT_SECRET
      - name: SHORTLINER_BACKEND_URL
        value: "http://shortliner-svc:8080"
      - name: ANALYTICS_BACKEND_URL
        value: "http://shortliner-analytics-svc:8082"
      - name: PAYMENT_BACKEND_URL
        value: "http://shortliner-payment-svc:8083"
      - name: FRONTEND_URL
        value: "http://shortliner-frontend-svc:80"
  - name: shortliner-frontend
    image: shortliner-frontend
    tag: sha-baa27d6
    port: 3000
    servicePort: 80
    # prom-client on its own port (not the public Next.js port 3000)
    metrics:
      enabled: true
      port: 9091
      path: /metrics
    replicas: 1
    strategy: Recreate
    securityContext:
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
    probes:
      readinessPath: /
      readinessDelay: 5
      livenessPath: /
      livenessDelay: 10
    env:
      # Plain server-side vars (not NEXT_PUBLIC_) — read at server startup/request time by
      # next.config.js rewrites or a route handler, proxying browser calls to /api/<service>/*
      # to these internal ClusterIP Services. Not baked into the client JS bundle.
      - name: SHORTLINER_BACKEND_URL
        value: "http://shortliner-svc:8080"
      - name: ANALYTICS_BACKEND_URL
        value: "http://shortliner-analytics-svc:8082"
      - name: PAYMENT_BACKEND_URL
        value: "http://shortliner-payment-svc:8083"
    # OIDC (Keycloak) env vars intentionally omitted — a gateway is going in front of
    # these services; the frontend will talk only to the gateway, not to Keycloak or
    # the backends directly. Re-add once the gateway's auth boundary is settled.
