apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: english-teacher
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/lukaszsiedlecki/homelab.git'
    targetRevision: HEAD
    path: apps/english-teacher
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: english-teacher
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
