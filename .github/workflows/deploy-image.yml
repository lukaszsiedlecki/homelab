name: Deploy image

on:
  repository_dispatch:
    types: [deploy-image]

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate service
        env:
          SERVICE: ${{ github.event.client_payload.service }}
        run: |
          case "$SERVICE" in
            shortliner|shortliner-analytics|shortliner-frontend|shortliner-payment) ;;
            *)
              echo "Unknown service: $SERVICE" >&2
              exit 1
              ;;
          esac

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Patch image tag
        env:
          SERVICE: ${{ github.event.client_payload.service }}
          TAG: ${{ github.event.client_payload.tag }}
          FILE: apps/shortliner/values.yaml
        run: |
          yq -i '(.services[] | select(.name == strenv(SERVICE)) | .tag) = strenv(TAG)' "$FILE"

      - name: Commit and push
        env:
          SERVICE: ${{ github.event.client_payload.service }}
          TAG: ${{ github.event.client_payload.tag }}
          FILE: apps/shortliner/values.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "No changes for $SERVICE at $TAG, nothing to commit"
          else
            git commit -m "chore: deploy ${SERVICE} ${TAG}"
            git push
          fi
