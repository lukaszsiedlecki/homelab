name: Deploy image

on:
  repository_dispatch:
    types: [deploy-image]

permissions:
  contents: write

# Backend and web of one push dispatch at the same time; serialize so the pushes don't race.
concurrency:
  group: deploy-image
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate service and pick its values file
        env:
          SERVICE: ${{ github.event.client_payload.service }}
        run: |
          case "$SERVICE" in
            shortliner|shortliner-analytics|shortliner-frontend|shortliner-payment|shortliner-gateway)
              FILE=apps/shortliner/values.yaml ;;
            english-teacher-backend|english-teacher-web|english-teacher-web-next)
              FILE=apps/english-teacher/values.yaml ;;
            *)
              echo "Unknown service: $SERVICE" >&2
              exit 1
              ;;
          esac
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Patch image tag
        env:
          SERVICE: ${{ github.event.client_payload.service }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          yq -i '(.services[] | select(.name == strenv(SERVICE)) | .tag) = strenv(TAG)' "$FILE"

      - name: Commit and push
        env:
          SERVICE: ${{ github.event.client_payload.service }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "No changes for $SERVICE at $TAG, nothing to commit"
          else
            git commit -m "chore: deploy ${SERVICE} ${TAG}"
            # checkout is at the dispatch-time commit; another deploy may have pushed since
            # (concurrency only serializes runs), so rebase onto the latest main and retry.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              sleep $((attempt * 5))
            done
            exit 1
          fi
